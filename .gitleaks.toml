# Open Instinct secret-scan rules. Default gitleaks rules plus the key shapes of the services we use.
title = "open-instinct"

[extend]
useDefault = true

[[rules]]
id = "inkbox-api-key"
description = "Inkbox API key"
regex = '''ApiKey_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.[A-Za-z0-9_-]{10,}'''

[[rules]]
id = "inkbox-signing-key"
description = "Inkbox webhook signing key"
regex = '''whsec_[A-Za-z0-9_-]{24,}'''

[[rules]]
id = "maritime-api-key"
description = "Maritime API key"
regex = '''mk_[A-Za-z0-9_-]{30,}'''

[[rules]]
id = "ample-agent-secret"
description = "Ample agent credential secret"
regex = '''ample_agent_[0-9a-f]{64}'''

[[rules]]
id = "link-token"
description = "Stripe Link agent wallet token"
regex = '''liwl(token|refresh)_[A-Za-z0-9_-]{10,}'''

[allowlist]
description = "Test fixtures and documentation placeholders"
paths = [
  '''packages/.*/test/.*''',
  '''docs/research/.*''',
]
regexes = [
  '''whsec_(testsecret|fromcreate|local_test|0123456789abcdef)''',
  '''ApiKey_\.\.\.''',
  '''mk_\.\.\.''',
]
